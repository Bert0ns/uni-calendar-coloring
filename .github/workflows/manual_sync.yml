name: Manual Calendar Sync

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to sync"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - exams
          - lectures
          - deadlines
      verbose:
        description: "Enable verbose logging"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Only show what would change (no calendar or state writes)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Reconstruct Secure Credentials
        env:
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GCP_TOKEN_JSON: ${{ secrets.GCP_TOKEN_JSON }}
          GCP_TOKEN_PICKLE_B64: ${{ secrets.GCP_TOKEN_PICKLE_B64 }}
        run: |
          if [ -z "$GCP_CREDENTIALS_JSON" ]; then
            echo "::error::Secret GCP_CREDENTIALS_JSON is missing or empty."
            exit 1
          fi
          printf '%s' "$GCP_CREDENTIALS_JSON" > credentials.json

          if [ -n "$GCP_TOKEN_JSON" ]; then
            printf '%s' "$GCP_TOKEN_JSON" > token.json
          elif [ -n "$GCP_TOKEN_PICKLE_B64" ]; then
            # Legacy secret: migrated to token.json automatically at runtime.
            printf '%s' "$GCP_TOKEN_PICKLE_B64" | base64 --decode > token.pickle
            if [ ! -s token.pickle ]; then
              echo "::error::Failed to decode GCP_TOKEN_PICKLE_B64."
              exit 1
            fi
          else
            echo "::error::Secret GCP_TOKEN_JSON (contents of token.json) is missing or empty."
            exit 1
          fi

      - name: Run Sync
        env:
          # Optional: override the calendars saved in profile.json.
          SOURCE_CALENDAR_NAME: ${{ secrets.SOURCE_CALENDAR_NAME }}
          TARGET_CALENDAR_NAME: ${{ secrets.TARGET_CALENDAR_NAME }}
          SOURCE_ICAL_URL: ${{ secrets.SOURCE_ICAL_URL }}
          TARGET: ${{ inputs.target }}
          VERBOSE: ${{ inputs.verbose }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=("$TARGET"); fi
          if [ "$VERBOSE" == "true" ]; then args+=("--verbose"); fi
          if [ "$DRY_RUN" == "true" ]; then args+=("--dry-run"); fi
          unical --no-tui "${args[@]}"

      - name: Persist the profile
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f profile.json ] && git add profile.json
          git diff --staged --quiet || git commit -m "chore: update sync state [skip ci]"
          git push
