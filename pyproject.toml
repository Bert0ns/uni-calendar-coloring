[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-calendar-coloring"
dynamic = ["version"]
description = "Sync a read-only university calendar into a color-coded Google Calendar."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    { name = "Davide Bertoni" },
]
keywords = [
    "calendar",
    "cli",
    "google-calendar",
    "ical",
    "timetable",
    "tui",
    "university",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Utilities",
]
dependencies = [
    "google-api-python-client>=2.150.0,<3.0.0",
    "google-auth>=2.0.0,<3.0.0",
    "google-auth-httplib2>=0.2.0,<1.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",
    "packaging>=23.0",
    "platformdirs>=4.0.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "textual>=1.0.0,<9.0.0",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/Bert0ns/uni-calendar-coloring"
Documentation = "https://github.com/Bert0ns/uni-calendar-coloring#readme"
Repository = "https://github.com/Bert0ns/uni-calendar-coloring"
Issues = "https://github.com/Bert0ns/uni-calendar-coloring/issues"
Changelog = "https://github.com/Bert0ns/uni-calendar-coloring/releases"

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "build>=1.0.0",
    "mypy>=1.10",
    "pre-commit>=3.6.0",
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "twine>=5.0.0",
]

[project.scripts]
unical = "unical.cli.main:main"

[tool.setuptools.dynamic]
version = { attr = "unical.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unical = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["BLE001", "E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["googleapiclient.*", "google_auth_oauthlib.*", "oauthlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["unical"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
